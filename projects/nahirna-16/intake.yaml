# Что известно об источниках и открытые вопросы. Формат — README, раздел «intake.yaml».
sources:
  - { file: "source/План освітлювальних приладів.pdf", note: "лист 08; длины сняты с векторов PDF, 13,568 мм/pt" }
  - { file: "source/План розміщення розеток.pdf", note: "лист 09" }

questions:
  - id: q1
    stage: plan
    text: >-
      Нет обмерного плана: все длины стен черновые (векторы PDF). Заказчик называет короткую
      сторону 5,5 м, по подписанным привязкам выходит ≈6,3 м. Есть ли обмер?
    answer: text
    severity: major
    assumption: "длины с векторов PDF"
  - id: q2
    stage: plan
    target: default_wall_thickness
    text: "Толщины стен и перегородок (400 / 200 / 100) сняты с векторов PDF, не подписаны"
    answer: value
    unit: mm
    assumption: 400
  - id: q3
    stage: plan
    text: "Шафа в коридоре («середина стінки») описана как стена-короб 900×640 — так и есть?"
    answer: text
    severity: minor
  - id: q4
    stage: plan
    text: "Окна и балконные блоки в столовой и спальне: границы и высоты условные"
    answer: text
    severity: minor
  - id: q5
    stage: plan
    text: "Двери: ширина проёма по PDF, петли и открывание — по дугам на плане. Подтвердить?"
    answer: text
    severity: minor
  - id: q6
    stage: electrical
    text: "Групп автоматов на листах нет. Сейчас в модели разбивка по помещениям (допущение, режим standard): свет — QF1 кухня-гостиная, QF2 коридор и передпокій (с проходными и мастер-выключателем), QF3 спальня, QF4 кабинет, QF5 столовая, QF6 санузел, QF7 санузел 2 (с вытяжками); розетки — QF8 кухня, QF9 гостиная, коридор и передпокій, QF10 спальня, QF11 кабинет, QF12 столовая, QF13 и QF14 санузлы (через УЗО); QF15, QF16 — кондиционеры кухни и спальни; QF17 — рушникосушка; QF18 — тёплый пол. Свет 3×1,5, остальное 3×2,5. Подтвердите, выберите режим economy (меньше автоматов) или пришлите схему щита."
    answer: text
    severity: major
