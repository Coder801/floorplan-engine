# Что известно об источниках и открытые вопросы. Формат — README, раздел «intake.yaml».
sources:
  - { file: "source/Діма_і_Аня_план_після_перепланування.pdf", note: "план после перепланировки + ответы заказчика" }
  - { file: "source/Діма і Аня електрика.pdf", note: "электрика: точки, высоты, группы" }
  - { file: "source/изменения-заказчика.md", note: "2026-10-21: кондиционер в зале; 2026-10-28: тёплый пол, группы кухни, зал и коридор раздельно" }

stages:
  plumbing: { status: found, note: "прилади меблями на плані електрики; стояків на листах немає" }

questions:
  - id: q1
    stage: plan
    target: rooms.living.openings.living_window_1.sill
    text: "Окно 2400 в гостиной: высота подоконника не указана"
    answer: value
    unit: mm
  - id: q2
    stage: plan
    target: rooms.balcony.openings.balcony_window_1.sill
    text: "Окно 2400 на балконе: высота подоконника не указана"
    answer: value
    unit: mm
  - id: q3
    stage: plan
    target: rooms.storage.walls.w2.length
    also: [rooms.storage.walls.w4.length, rooms.living.walls.w6.length]
    text: "Ширина кладовки на плане не подписана: 1783 — расчёт 7245 − 5462"
    answer: value
    unit: mm
    assumption: 1783
  - id: q4
    stage: electrical
    target: points.living_socket_14.offset
    text: "Кондиционер в зале, нижняя стена, справа окно: сколько мм от правого угла (у окна) до середины розетки кондиционера?"
    answer: value
    unit: mm
    assumption: 400
  - id: q5
    stage: electrical
    target: points.living_socket_14.height
    text: "Кондиционер в зале: на какой высоте от пола розетка или вывод кабеля?"
    answer: value
    unit: mm
    assumption: 2200
  - id: q6
    stage: electrical
    text: "Кондиционер — отдельная группа от щита (QF14, кабель 3×2,5, автомат 16 А)? Так сейчас в модели."
    answer: text
    severity: minor
  - id: q7
    stage: electrical
    target: points.living_floor_reg_1.offset
    text: "Тёплый пол в коридоре: где регулятор? Сейчас — на стене у входа, рядом с выключателем коридора (мм от угла с санвузлом до середины)"
    answer: value
    unit: mm
    assumption: 240
  - id: q8
    stage: electrical
    target: points.living_floor_reg_2.offset
    text: "Тёплый пол в санвузле: где регулятор? Сейчас — в коридоре снаружи санвузла, слева от его выключателя (мм от начала стены у выступа)"
    answer: value
    unit: mm
    assumption: 780
  - id: q9
    stage: electrical
    target: points.living_floor_reg_1.height
    also: [points.living_floor_reg_2.height]
    text: "Регуляторы тёплого пола: на какой высоте от пола?"
    answer: value
    unit: mm
    assumption: 900
  - id: q10
    stage: plumbing
    text: >-
      Стояків на листах немає. Стояк каналізації і води поставлено в кут біля вентканалу поруч з
      унітазом (допущення). Де стояки? Квадрат із хрестом у правому верхньому куті санвузла на плані
      електрики — шахта зі стояками? Місця приладів зняті за масштабом PDF — підтвердіть.
    answer: text
    severity: major
  - id: q11
    stage: plumbing
    target: risers.riser_1.sewer_inlet
    text: "На якій висоті від чистої підлоги вісь врізки в стояк каналізації?"
    answer: value
    unit: mm
    assumption: 100
  - id: q12
    stage: plumbing
    text: >-
      Ванна: випуск (≈100 мм від підлоги) не дотягує до стояка — 2,9 м по трубах, потрібен подіум
      близько 65 мм. Ставимо ванну на подіум чи стояк інде (див. q10)?
    answer: text
    severity: major
  - id: q13
    stage: plumbing
    text: >-
      Гаряча вода — від бойлера (він є на плані), централізованої ГВП немає? Висоти водорозеток,
      бойлера і випусків — типові («*» у таблиці «Сантехприлади»): моделі приладів?
    answer: text
    severity: minor
