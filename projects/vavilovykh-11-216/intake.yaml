stages:
  plan: { status: found, note: "стіни без змін у новій редакції; нові висоти Д-03, Д-04 і вікно кухні — А-19, А-22, А-27, А-28; висота стелі 2700 — замовник" }
  electrical: { status: found, note: "нова редакція А-35…А-38: 56 розеток, 4 INT, 10 виводів, домофон, 29 точкових, 3 бра, 2 підвіси, 5 виводів 12 В, 21 вимикач; тепла підлога А-29: 4 зони, 4 терморегулятори; кабель-канал ТВ; груп щита в джерелі немає — mode: standard (замовник)" }
