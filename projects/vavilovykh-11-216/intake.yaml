questions:
  - id: q1
    stage: plan
    text: "Усі розміри взято чистові (А-28, А-34: «з урахуванням оздоблювальних матеріалів»), перегородки — конструктив + 20 мм оздоблення на сторону (120 → 160, 240 → 280). Так і креслимо? Інакше — конструктивні розміри А-16 (кожна кімната на 40 мм більша)."
    answer: text
    severity: major
  - id: q2
    stage: plan
    target: rooms.bath.openings.bath_door_1.width
    also: [rooms.hall.openings.hall_opening_4.width]
    text: "Двері санвузла: на плані монтажу А-22 проріз усе ще підписано 700, на А-27 і в специфікації А-28 Д-02 — полотно 700, проріз 800. Узято 800."
    answer: value
    unit: mm
    assumption: 800
  - id: q4
    stage: plan
    text: "Санвузол: нижня стіна за інсталяцією унітаза і нішею (ГКЛ 300, нова ред. А-22: 495 | 445 | 780) і короб каналізаційної труби біля пілона в контур не внесені — контур узято по конструктиву (пілон 430 — у контурі). Залишити так (інсталяція — перешкода на етапі сантехніки)?"
    answer: text
    severity: minor
  - id: q5
    stage: electrical
    target: board.height
    text: "Ел.щит і слабкострумовий щит біля входу (А-19, А-34): висота центру щита на листах не підписана. Узято 1700."
    answer: value
    unit: mm
    assumption: 1700
  - id: q6
    stage: electrical
    text: "Розеток на листах порахувано 56 (+4 INT), у легенді А-37 і специфікації А-38 — 57. Якої розетки бракує? Дизайнеру: у А-38 також лишилось 10 одноклавішних і 2 двоклавішних вимикачі проти 9 і 3 на А-35, А-36."
    answer: text
    severity: minor
  - id: q7
    stage: electrical
    target: points.wardrobe_outlet_1.height
    text: "Вивід для вентилятора в гардеробній — на стелі (680 від низу, 980 від правої стіни, А-34). Схема точок на стелі для виводів не має: вивід прив'язано до правої стіни w7 на висоті стелі 2700. Залишити?"
    answer: value
    unit: mm
    assumption: 2700
  - id: q9
    stage: plumbing
    text: "Сантехніка (лист А-27, стор. 14) у перелік сторінок не входила — plumbing.yaml не писався. Розбирати?"
    answer: text
    severity: major
  - id: q10
    stage: electrical
    text: "Тепла підлога (А-29): 4 зони — кухня 6,35, передпокій 5,28, лоджія 2,53, санвузол 1,69 м², усього 15,85 м². Потужності на листах немає: поки типова 1,5 кВт на кожен терморегулятор, це завищено для малих зон. Яка потужність кожної зони або яка питома, Вт/м²? На резерві тепла підлога не тримається (замовник)."
    answer: text
    severity: major
  - id: q11
    stage: electrical
    text: "Кабель-канал ТВ у кімнаті: значки на А-37 стоять на 990 (H=400) і 960 (H=1100) за масштабом; у моделі — один вертикальний канал на 975, широка штроба 700 мм. Підтвердьте місце."
    answer: text
    severity: minor
