# Що відомо про джерела і відкриті питання. Формат — README, розділ «intake.yaml».
sources:
  - { file: "source/ЖК_Будинок_на_Вавілових.pdf", note: "дизайн-проєкт SMIRNOVA, 34 стор. (векторний, 1:35). Розібрано: А-16 обміри (3), А-17 демонтаж (4), А-19 монтаж (6), А-21 меблі (8), А-24/А-25 двері (11, 12), А-28 підлоги (15), А-29–А-31 (16–18), А-32 світильники (19), А-33 групи світла (20), А-34 розетки (21). Не розбирались: А-26 опалення (13), А-27 сантехніка (14), розгортки (23–34)" }

stages:
  plan: { status: found, note: "чистові розміри А-28 + обміри А-16; нові перегородки — А-19; висота стелі 2700 — замовник" }
  electrical: { status: found, note: "А-32…А-35: 55 розеток, 4 INT, 10 виводів, домофон, 29 точкових, 3 бра, люстра, 5 виводів 12 В, 21 вимикач; груп щита в джерелі немає — mode: standard (замовник)" }
  plumbing: { status: found, note: "прилади на А-21/А-27 (ванна, унітаз з інсталяцією, умивальник, пральна і сушильна, посудомийна, бойлер, фільтри); лист А-27 (стор. 14) не розбирався — не в переліку сторінок" }

questions:
  - id: q1
    stage: plan
    text: "Усі розміри взято чистові (А-28, А-34: «з урахуванням оздоблювальних матеріалів»), перегородки — конструктив + 20 мм оздоблення на сторону (120 → 160, 240 → 280). Так і креслимо? Інакше — конструктивні розміри А-16 (кожна кімната на 40 мм більша)."
    answer: text
    severity: major
  - id: q2
    stage: plan
    target: rooms.bath.openings.bath_door_1.width
    also: [rooms.hall.openings.hall_opening_4.width]
    text: "Двері санвузла: на плані монтажу А-19 проріз підписано 700 (Нпр=2050), у специфікації А-25 Д-02 — полотно 700, проріз 800. Узято 800 за специфікацією (плінтус на А-28 теж дає 800)."
    answer: value
    unit: mm
    assumption: 800
  - id: q3
    stage: plan
    text: "Зняті за масштабом PDF (не підписані): вікно кухні — 1990 від кута з вентшахтою до простінка 560; вікно спальні на верхній стіні — впритул до кута з гардеробною; висота лоджії 2940 (обміри 2980 − оздоблення). Підтвердьте або пришліть обміри."
    answer: text
    severity: major
  - id: q4
    stage: plan
    text: "Санвузол: нижня стіна за інсталяцією унітаза і нішею (ГКЛ 300, А-19: 495 | 495 | 730) і короб каналізаційної труби біля пілона в контур не внесені — контур узято по конструктиву (пілон 430 — у контурі). Залишити так (інсталяція — перешкода на етапі сантехніки)?"
    answer: text
    severity: minor
  - id: q5
    stage: electrical
    target: board.height
    text: "Ел.щит і слабкострумовий щит біля входу (А-19, А-34): висота центру щита на листах не підписана. Узято 1700."
    answer: value
    unit: mm
    assumption: 1700
  - id: q6
    stage: electrical
    text: "Розеток на листі А-34 порахувано 55 (+4 INT), у специфікації А-35 — 57. Терморегулятори (4 шт. у специфікації) на листах електрики не показані — вони на плані опалення А-26 (не розбирався)? Пришліть, де стоять, або підтвердьте, що тепла підлога — окремим етапом."
    answer: text
    severity: minor
  - id: q7
    stage: electrical
    target: points.wardrobe_outlet_1.height
    text: "Вивід для вентилятора в гардеробній — на стелі (680 від низу, 980 від правої стіни, А-34). Схема точок на стелі для виводів не має: вивід прив'язано до правої стіни w7 на висоті стелі 2700. Залишити?"
    answer: value
    unit: mm
    assumption: 2700
  - id: q8
    stage: electrical
    text: "Вимикачі: три перехресні «10» у спальні (біля дверей і біля ліжка з двох боків) вмикають бра праворуч (гр.10), три перехресні «5» (лоджія, кімната, передпокій) — стелю кімнати (гр.5) — так прочитано з номерів груп на А-33. Вимикачі 13+В і 16+В узято 2-клавішними (стеля + вентилятор); у специфікації 2-клавішних — 2, 1-клавішних — 10. Підтвердьте."
    answer: text
    severity: minor
  - id: q9
    stage: plumbing
    text: "Сантехніка (лист А-27, стор. 14) у перелік сторінок не входила — plumbing.yaml не писався. Розбирати?"
    answer: text
    severity: major
