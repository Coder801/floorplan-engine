# Общий прайс студии для сметы электрики: берётся, если у проекта нет своего prices.yaml. Цены — за единицу позиции, грн.
# Ключи позиций — в src/floorplan_engine/estimate.py (LINES); cable.<марка> — по марке кабеля.
# Позиция без цены остаётся в смете с пометкой «нет цены» и в итог не входит.
currency: грн
date: "2026-11"
note: "орієнтир за ринком Києва, звірити з постачальником і бригадою"
items:
  # Материалы
  cable.3x1.5: { price: 45, name: "Кабель ВВГнг 3×1,5" }
  cable.3x2.5: { price: 70, name: "Кабель ВВГнг 3×2,5" }
  socket_box: 20
  junction_box: 60
  junction_box_ip: 120           # IP44 у санвузлах
  crimp: 8                       # гильза ГМЛ + термоусадка на соединение
  cable_fixing: 2                # клипса / дюбель-хомут
  board_enclosure: { price: 6000, name: "Корпус щита вбудований, 5 рядів, 60 мод." }
  breaker: 140                   # класс Schneider Easy9
  # Механизмы и рамки — по выбранной серии, впишите цены:
  # socket, switch1, switch2, pass_switch, data, tv, frame.1 … frame.4
  # Работы
  work.cable: 34                 # по потолку на креплениях, без гофры; с маркировкой концов
  # Штроба узкая, 1–2 кабеля, по материалу стены (material в room.yaml); широкая — ×1,5
  work.chase.concrete: 200
  work.chase.claydite: 150
  work.chase.brick: 120
  work.chase.aerated: 90
  work.chase: 120                # материал стены не указан — по кирпичу
  work.wall_hole: 100            # проход через стену над дверью, Ø25–32
  work.conduit: 15               # затяжка в гофру сверх прокладки
  work.socket_box: 140
  work.junction_box: 250         # установка и коммутация с опрессовкой
  work.board_install: 1500       # ниша и установка щита на 5 рядов
  work.board_module: 100         # сборка щита, за модуль
  work.mechanism: 100            # розетка, выключатель, интернет/ТВ — в подрозетник
  work.insulation_test: 150      # замер мегаомметром, за группу, с протоколом
board_kit:                       # щит сверх автоматов по группам
  - { name: "Вступний автомат 2P 40 A", price: 500, modules: 2 }
  - { name: "Реле напруги", price: 1500, modules: 2 }
  - { name: "ПЗВ 2P 40 A 30 мА", price: 1200, qty: 2, modules: 2 }
