[project]
name = "shtroba"
version = "0.1.0"
description = "Чертежи DXF (план помещения, электрика) из YAML-описания"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "matplotlib>=3.8",
    "numpy>=2.4.6",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "shapely>=2.2.0",
    "typer>=0.12",
]

[project.scripts]
shtroba = "shtroba.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shtroba"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "types-shapely>=2.1.0.20260728",
]
service = [
    "alembic>=1.20.1",
    "anthropic>=1.15.0",
    "fastapi>=0.151.0",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NumPy 2.5 предупреждает о коде внутри ezdxf, не нашем
filterwarnings = ["ignore::DeprecationWarning:ezdxf.*"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["ezdxf.*", "matplotlib.*", "pypdfium2.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH"]
# Кириллица в строках и комментариях — норма для проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv]
# Сервис (FastAPI) — отдельная группа: ядро и CLI от неё не зависят
default-groups = ["dev", "service"]
