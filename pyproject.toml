[project]
name = "floorplan-engine"
version = "0.1.0"
description = "Чертежи DXF (план помещения, электрика) из YAML-описания"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "matplotlib>=3.8",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "shapely>=2.2.0",
    "typer>=0.12",
]

[project.scripts]
floorplan-engine = "floorplan_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorplan_engine"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "import-linter>=2.1",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-openpyxl>=3.1.5.20261017",
    "types-PyYAML>=6.0",
    "types-shapely>=2.1.0.20260728",
]
service = [
    "alembic>=1.20.1",
    "anthropic>=1.15.0",
    "authlib>=1.9.1",
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NumPy 2.5 предупреждает о коде внутри ezdxf, не нашем
filterwarnings = ["ignore::DeprecationWarning:ezdxf.*"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["authlib.*", "ezdxf.*", "matplotlib.*", "pypdfium2.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH"]
# Кириллица в строках и комментариях — норма для проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv]
# Сервис (FastAPI) — отдельная группа: ядро и CLI от неё не зависят
default-groups = ["dev", "service"]

# Слои пакета и направление импортов (uv run lint-imports; входит в verify). Выше по списку —
# может импортировать ниже, не наоборот; исключений нет — общее для слоёв выносится вниз
[tool.importlinter]
root_package = "floorplan_engine"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои: CLI → сервис → конвейер → .epd → листы → проверка → рисование → расчёты → модель"
type = "layers"
layers = [
    "floorplan_engine.cli",
    "floorplan_engine.service",
    "floorplan_engine.pipeline",
    "floorplan_engine.epd",
    "floorplan_engine.sheets",
    "floorplan_engine.validation",
    "floorplan_engine.drawing",
    "floorplan_engine.electrical",
    "floorplan_engine.model",
]

[[tool.importlinter.contracts]]
name = "Ядро не импортирует сервис"
type = "forbidden"
source_modules = [
    "floorplan_engine.model",
    "floorplan_engine.validation",
    "floorplan_engine.electrical",
    "floorplan_engine.drawing",
    "floorplan_engine.sheets",
    "floorplan_engine.epd",
    "floorplan_engine.pipeline",
]
forbidden_modules = ["floorplan_engine.service"]

[[tool.importlinter.contracts]]
name = "Ядро без LLM, сети, базы и веб-сервера"
type = "forbidden"
source_modules = [
    "floorplan_engine.model",
    "floorplan_engine.validation",
    "floorplan_engine.electrical",
    "floorplan_engine.drawing",
    "floorplan_engine.sheets",
    "floorplan_engine.epd",
    "floorplan_engine.pipeline",
]
forbidden_modules = ["anthropic", "fastapi", "httpx", "sqlalchemy", "alembic", "authlib", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Модель, проверка и расчёты не рисуют DXF сами"
type = "forbidden"
source_modules = ["floorplan_engine.model", "floorplan_engine.validation", "floorplan_engine.electrical"]
forbidden_modules = ["ezdxf"]
allow_indirect_imports = true
