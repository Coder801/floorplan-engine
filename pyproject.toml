[project]
name = "floorplan-engine"
version = "0.4.1"
description = "DXF drawings (room plan, electrical) from a YAML description"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "matplotlib>=3.8",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "shapely>=2.2.0",
    "typer>=0.12",
]

[project.scripts]
floorplan-engine = "floorplan_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorplan_engine"]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "httpx2>=2.15.1",
    "import-linter>=2.1",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-openpyxl>=3.1.5.20261017",
    "types-PyYAML>=6.0",
    "types-shapely>=2.1.0.20260728",
]
service = [
    "alembic>=1.20.1",
    "anthropic>=1.15.0",
    "authlib>=1.9.1",
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "opencv-python-headless>=5.0.0.93",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NumPy 2.5 warns about code inside ezdxf, not ours
filterwarnings = ["ignore::DeprecationWarning:ezdxf.*"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["authlib.*", "ezdxf.*", "matplotlib.*", "pypdfium2.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH"]
# Cyrillic in strings and comments is normal for this project
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv]
# The service (FastAPI) is a separate group: the core and CLI do not depend on it
default-groups = ["dev", "service"]

# Package layers and import direction (uv run lint-imports; part of verify). Higher in the list
# may import lower, never the other way; there are no exceptions: shared code moves down
[tool.importlinter]
root_package = "floorplan_engine"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: CLI → service → pipeline → .epd → sheets → validation → drawing → plumbing → electrical → model"
type = "layers"
layers = [
    "floorplan_engine.cli",
    "floorplan_engine.service",
    "floorplan_engine.pipeline",
    "floorplan_engine.epd",
    "floorplan_engine.sheets",
    "floorplan_engine.validation",
    "floorplan_engine.drawing",
    "floorplan_engine.plumbing",
    "floorplan_engine.electrical",
    "floorplan_engine.model",
]

[[tool.importlinter.contracts]]
name = "The core does not import the service"
type = "forbidden"
source_modules = [
    "floorplan_engine.model",
    "floorplan_engine.validation",
    "floorplan_engine.electrical",
    "floorplan_engine.plumbing",
    "floorplan_engine.drawing",
    "floorplan_engine.sheets",
    "floorplan_engine.epd",
    "floorplan_engine.pipeline",
]
forbidden_modules = ["floorplan_engine.service"]

[[tool.importlinter.contracts]]
name = "The core has no LLM, network, database or web server"
type = "forbidden"
source_modules = [
    "floorplan_engine.model",
    "floorplan_engine.validation",
    "floorplan_engine.electrical",
    "floorplan_engine.plumbing",
    "floorplan_engine.drawing",
    "floorplan_engine.sheets",
    "floorplan_engine.epd",
    "floorplan_engine.pipeline",
]
forbidden_modules = ["anthropic", "fastapi", "httpx", "sqlalchemy", "alembic", "authlib", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Model, validation and calculations do not draw DXF themselves"
type = "forbidden"
source_modules = [
    "floorplan_engine.model",
    "floorplan_engine.validation",
    "floorplan_engine.electrical",
    "floorplan_engine.plumbing",
]
forbidden_modules = ["ezdxf"]
allow_indirect_imports = true

# Version and release (docs/development.md, "Commits and versions"): commit titles follow
# Conventional Commits (checked by the web/.husky/commit-msg hook); `uv run cz bump` bumps the
# version by the commit types since the last tag, edits the version files, writes CHANGELOG.md,
# commits and tags
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
annotated_tag = true               # git push --follow-tags sends only annotated tags
major_version_zero = true          # alpha for now: feat is minor, fix is patch, breaking is minor too
update_changelog_on_bump = true
version_files = [
    "src/floorplan_engine/__init__.py:__version__",
    "web/package.json:\"version\"",
    "admin/package.json:\"version\"",
]
pre_bump_hooks = ["uv run --no-sync python scripts/release_lock.py"]  # web/ and admin/ package-lock.json
