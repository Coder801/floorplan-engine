# Service database for development: uv run floorplan-engine … with DATABASE_URL from .env (see .env.example)
#   docker compose up -d db        — start
#   uv run alembic upgrade head    — create or update the tables
services:
  db:
    image: postgres:17
    container_name: floorplan-engine-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floorplan_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floorplan_engine}
      POSTGRES_DB: ${POSTGRES_DB:-floorplan_engine}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # 5432 is often taken by other projects
    volumes:
      - floorplan-engine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floorplan_engine} -d ${POSTGRES_DB:-floorplan_engine}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  floorplan-engine-pgdata:
