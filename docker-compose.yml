# База сервиса для разработки: uv run floorplan-engine … с DATABASE_URL из .env (см. .env.example)
#   docker compose up -d db        — поднять
#   uv run alembic upgrade head    — создать или обновить таблицы
services:
  db:
    image: postgres:17
    container_name: floorplan-engine-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floorplan_engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floorplan_engine}
      POSTGRES_DB: ${POSTGRES_DB:-floorplan_engine}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # 5432 часто занят другими проектами
    volumes:
      - floorplan-engine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floorplan_engine} -d ${POSTGRES_DB:-floorplan_engine}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  floorplan-engine-pgdata:
