# Состав работ электрики: что входит в цену позиции сметы, что не входит и чем работа сдаётся.
# Ключи — работы `work.*` из LINES (electrical/estimate.py), у каждой работы должен быть состав.
#   includes — операции, которые входят в цену позиции;
#   excludes — чего клиент может ждать, но в цену позиции не входит:
#     ref — позиции сметы, где это оплачивается; без ref — в смету не входит вовсе;
#   result   — в каком виде работа сдаётся (то, что клиент может проверить).
# Цен здесь нет: цена — в prices.yaml. Поменяли состав — проверьте, что цена ему отвечает.

work.cable:
  includes:
    - ru: "разметка трассы по чертежу проводки"
      uk: "розмітка траси за кресленням проводки"
    - ru: "раскладка кабеля по трассе"
      uk: "розкладання кабелю по трасі"
    - ru: "фиксация кабеля креплениями"
      uk: "фіксація кабелю кріпленнями"
    - ru: "вывод концов у точек, коробок и щита с запасом на подключение"
      uk: "виведення кінців біля точок, коробок і щита із запасом на підключення"
  excludes:
    - ru: "штроба"
      uk: "штроба"
      ref: [work.chase, work.chase_wide]
    - ru: "отверстие в стене для прохода трассы"
      uk: "отвір у стіні для проходу траси"
      ref: [work.wall_hole]
    - ru: "укладка в гофротрубу"
      uk: "укладання в гофротрубу"
      ref: [work.conduit]
    - ru: "соединение жил в коробках"
      uk: "з'єднання жил у коробках"
      ref: [work.junction_box]
    - ru: "подключение к аппаратам щита"
      uk: "підключення до апаратів щита"
      ref: [work.board_module]
    - ru: "подключение розеток и выключателей"
      uk: "підключення розеток і вимикачів"
      ref: [work.mechanism]
    - ru: "маркировка концов"
      uk: "маркування кінців"
      ref: [work.marking]
    - ru: "замер сопротивления изоляции"
      uk: "вимірювання опору ізоляції"
      ref: [work.insulation_test]
  result:
    ru: "кабель лежит по трассе и закреплён, концы выведены, не зачищены и не подключены"
    uk: "кабель лежить по трасі й закріплений, кінці виведені, не зачищені й не підключені"

