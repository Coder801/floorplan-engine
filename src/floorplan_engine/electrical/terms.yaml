# Пункты, которые обговариваются с заказчиком отдельно от работ сметы (electrical/terms.py).
# По каждому до начала работ договариваются: кто делает (студия или заказчик) и как это
# оплачивается. Решения студии — в разделе terms прайса (prices.yaml), здесь только каталог.
#   name    — название пункта;
#   about   — о чём договариваются;
#   unit    — единица для оплаты «по факту» (prices.yaml может задать свою);
#   percent — от чего считается процент, если так платят: materials — от материалов сметы
#             (сумма считается), work — надбавка к работам в это время (сумма по факту).
# Цен здесь нет. Порядок пунктов — порядок в смете и в составе работ.

delivery:
  name: { ru: "Доставка материалов", uk: "Доставка матеріалів" }
  about:
    ru: "кто привозит материалы на объект и сколько стоит рейс"
    uk: "хто привозить матеріали на об'єкт і скільки коштує рейс"
  unit: { ru: "рейс", uk: "рейс" }

carry:
  name: { ru: "Подъём и занос материалов", uk: "Підйом і занесення матеріалів" }
  about:
    ru: "подъём по лестнице, если лифта нет или материал в него не входит, — цена за этаж"
    uk: "підйом сходами, якщо ліфта немає або матеріал у нього не входить, — ціна за поверх"
  unit: { ru: "этаж", uk: "поверх" }

purchase:
  name: { ru: "Закупка материалов бригадой", uk: "Закупівля матеріалів бригадою" }
  about:
    ru: "кто покупает материалы по смете; если бригада — процент от стоимости материалов"
    uk: "хто купує матеріали за кошторисом; якщо бригада — відсоток від вартості матеріалів"
  unit: { ru: "закупка", uk: "закупівля" }
  percent: materials

debris:
  name: { ru: "Вывоз строительного мусора", uk: "Вивезення будівельного сміття" }
  about:
    ru: "мусор в мешках до контейнера или вывоз машиной; кто заказывает контейнер"
    uk: "сміття в мішках до контейнера або вивезення машиною; хто замовляє контейнер"
  unit: { ru: "мешок", uk: "мішок" }

dismantling:
  name: { ru: "Демонтаж старой проводки", uk: "Демонтаж старої проводки" }
  about:
    ru: "снятие старых розеток, выключателей, светильников и кабеля, которые не войдут в новую проводку"
    uk: "зняття старих розеток, вимикачів, світильників і кабелю, які не ввійдуть у нову проводку"
  unit: { ru: "точка", uk: "точка" }

power_off:
  name:
    ru: "Отключение питания и согласование"
    uk: "Відключення живлення й погодження"
  about:
    ru: "отключение квартиры или стояка, согласование с ОСББ, управляющей компанией или энергосетью; кто договаривается"
    uk: "відключення квартири або стояка, погодження з ОСББ, керуючою компанією або енергомережею; хто домовляється"
  unit: { ru: "отключение", uk: "відключення" }

off_hours:
  name: { ru: "Работа в выходные и вечером", uk: "Робота у вихідні та ввечері" }
  about:
    ru: "шумные работы (штроба, сверление) — только в часы, разрешённые правилами дома; надбавка за работу вне рабочих дней и часов"
    uk: "гучні роботи (штроба, свердління) — лише в години, дозволені правилами будинку; надбавка за роботу поза робочими днями й годинами"
  unit: { ru: "час", uk: "година" }
  percent: work

downtime:
  name: { ru: "Простой по вине заказчика", uk: "Простій з вини замовника" }
  about:
    ru: "нет доступа на объект, нет материалов, решение не принято вовремя"
    uk: "немає доступу на об'єкт, немає матеріалів, рішення не ухвалене вчасно"
  unit: { ru: "день", uk: "день" }

parking:
  name: { ru: "Парковка и пропуск", uk: "Паркування і перепустка" }
  about:
    ru: "где ставить машину для разгрузки, пропуск на территорию и в лифт; кто оплачивает"
    uk: "де ставити машину для розвантаження, перепустка на територію і в ліфт; хто оплачує"
  unit: { ru: "день", uk: "день" }

no_power:
  name: { ru: "Работа без электроэнергии", uk: "Робота без електроенергії" }
  about:
    ru: "при отключениях света: генератор или зарядная станция, аккумуляторный инструмент, перенос работ; кто обеспечивает питание и как оплачивается простой"
    uk: "під час відключень світла: генератор або зарядна станція, акумуляторний інструмент, перенесення робіт; хто забезпечує живлення і як оплачується простій"
  unit: { ru: "день", uk: "день" }
