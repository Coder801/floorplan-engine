# Этапы монтажа электрики (docs/work-tasks.md, «Черновик из сметы»): каждая позиция сметы входит
# ровно в один этап. Ключи — базовые ключи LINES (electrical/estimate/items.py, split_key): позиция с
# параметром (`work.chase.brick`, `breaker.C16`, `cable.3x1.5`) идёт по ключу без параметра.
# «prefix.*» — все ключи LINES с этим началом. Тест сверяет: все ключи разложены, лишних нет.
#   key    — ключ этапа; у задачи — «electrical.<key>»;
#   title  — название задачи на языке проекта;
#   lines  — позиции сметы этапа: работы и материалы; без lines — бесплатный этап (в смете его
#            нет, в черновике он всегда, критерий — его result);
#   photo  — фото при сдаче: required — без фото не сдать, optional — по желанию, none — не нужно;
#   after  — этапы, после которых (мягкая зависимость); этапа нет в смете — берутся его after;
#   result — критерий приёмки; пусто — поле result работ этапа из work_scope.yaml.
# Порядок этапов — порядок работ; номер этапа — его место в этом списке.

stages:
  # Бесплатно (решение 2026-11-22): позиции в смете нет, выезд до начала работ. Расхождения
  # с чертежом не правятся на месте — их вносит студия, чертёж меняется по исходникам.
  - key: survey
    title: { ru: "Осмотр объекта и сверка с чертежом", uk: "Огляд об'єкта і звірка з кресленням" }
    photo: optional
    result:
      - ru: "размеры помещений и высота потолка сверены с чертежом"
        uk: "розміри приміщень і висоту стелі звірено з кресленням"
      - ru: "материал стен определён по помещениям"
        uk: "матеріал стін визначено по приміщеннях"
      - ru: "ввод проверен: выделенная мощность, место счётчика, заземление"
        uk: "ввід перевірено: виділена потужність, місце лічильника, заземлення"
      - ru: "место щита проверено: ниша, глубина, доступ"
        uk: "місце щита перевірено: ніша, глибина, доступ"
      - ru: "препятствия на трассах отмечены: балки, трубы, старая проводка (детектором)"
        uk: "перешкоди на трасах позначено: балки, труби, стара проводка (детектором)"
      - ru: "нулевой уровень отбит лазерным уровнем во всех помещениях"
        uk: "нульовий рівень відбито лазерним рівнем у всіх приміщеннях"
      - ru: "расхождения с чертежом переданы студии списком до начала работ"
        uk: "розбіжності з кресленням передано студії списком до початку робіт"

  - key: chases
    title: { ru: "Штробы и подрозетники", uk: "Штроби і підрозетники" }
    lines: [work.chase, work.chase_wide, work.socket_box, socket_box]
    photo: optional
    after: [survey]

  - key: cable
    title: { ru: "Прокладка кабеля и кабельные проходки", uk: "Прокладання кабелю і кабельні проходи" }
    # кабельные проходки — здесь (решение 2026-11-28): пена в гильзе — после протяжки кабелей
    lines: [work.cable, work.conduit, work.cable_pass, cable, conduit, conduit_joint,
            conduit_clip, cable_pad, sleeve, firestop_foam]
    photo: required  # трассы до штукатурки: то, что потом в стене
    after: [chases]

  - key: floor_heating
    title: { ru: "Тёплый пол: кабель и датчик", uk: "Тепла підлога: кабель і датчик" }
    lines: [work.floor_heating, heating_cable, heating_sensor, heating_conduit]
    photo: required  # змейка до стяжки: то, что потом в полу
    after: [cable]

  - key: boxes
    title: { ru: "Распаечные коробки", uk: "Розподільчі коробки" }
    # с 2026-11-25 — и соединения N и PE в подрозетниках выключателей (свет цепочкой): работа, без
    # клемм и гильз отдельной строкой
    lines: [work.junction_box, junction_box, junction_box_ip, crimp, work.splice, work.splice_crimp]
    photo: optional
    after: [cable]

  - key: board
    title: { ru: "Установка корпуса щита", uk: "Встановлення корпусу щита" }
    lines: [work.board_install, board_enclosure, dc_enclosure, led_enclosure]
    photo: optional

  - key: insulation
    title: { ru: "Замер изоляции", uk: "Вимірювання ізоляції" }
    lines: [work.insulation_test]
    photo: required  # протокол замера: фото или PDF
    after: [cable, boxes]

  - key: rough_light
    title: { ru: "Черновой свет", uk: "Чорнове світло" }
    lines: [work.rough_light, work.rough_switch, rough_holder, rough_lamp, rough_switch]
    photo: none
    after: [cable]

  - key: assembly
    title: { ru: "Сборка щита", uk: "Збирання щита" }
    lines: [work.board_module, work.panel_labels, breaker, diff, rcd, input, relay, spd, changeover, ats, contactor,
            feed, output, busbar, dc_battery, dc_breaker, dc_spd]
    photo: optional
    after: [board, insulation]

  - key: devices
    title: { ru: "Механизмы и светильники", uk: "Механізми і світильники" }
    lines: [work.mechanism, work.led_psu, work.led_psu_din, socket, switch1, switch2, pass_switch,
            data, tv, frame, light, downlight, pendant, sconce, led_output, outlet, thermostat,
            led_strip,
            led_psu, led_psu_din]
    photo: optional
    after: [assembly]

  - key: protection
    title: { ru: "Проверка защиты прибором", uk: "Перевірка захисту приладом" }
    lines: [work.protection_test]
    photo: required  # протокол проверки: фото или PDF
    after: [assembly, devices]
