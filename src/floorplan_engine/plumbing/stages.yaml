# Этапы монтажа сантехники (docs/work-tasks.md, «Черновик из сметы»): каждая позиция сметы
# (LINES в plumbing/estimate.py) входит ровно в один этап. Поля — как в electrical/stages.yaml;
# «prefix.*» — все ключи LINES с этим началом. У сантехники нет состава работ (work_scope.yaml),
# поэтому критерий приёмки (result) записан у каждого этапа здесь.
# Электрика и сантехника друг от друга не зависят: after — только этапы этого файла.

stages:
  - key: chases
    title: { ru: "Штробы и проходы под трубы", uk: "Штроби і проходи під труби" }
    lines: [work.chase_pipe, work.chase_sewer, work.chase_sewer_floor, work.wall_hole]
    photo: optional
    result:
      - ru: "штробы и отверстия выбраны по разметке, трубы помещаются в них ниже плоскости стены и пола"
        uk: "штроби й отвори вибрані за розміткою, труби вміщуються в них нижче площини стіни й підлоги"

  - key: sewer
    title: { ru: "Канализация", uk: "Каналізація" }
    lines: [work.sewer_pipe, work.riser_tee, work.sewer_box, sewer.*]
    photo: optional
    after: [chases]
    result:
      - ru: "трубы канализации уложены по трассе с уклоном к стояку и закреплены, врезка в стояк выполнена, выпуски заглушены"
        uk: "труби каналізації укладені по трасі з ухилом до стояка й закріплені, врізка в стояк виконана, випуски заглушені"

  - key: water
    title: { ru: "Водопровод", uk: "Водопровід" }
    lines: [work.input, work.water_pipe, work.water_outlet, water.*]
    photo: required  # трубы до стяжки: то, что потом в полу и в стене
    after: [chases]
    result:
      - ru: "трубы уложены по трассе и закреплены, водорозетки выставлены по чертежу, узел ввода и коллекторы смонтированы; трубы не закрыты до опрессовки"
        uk: "труби укладені по трасі й закріплені, водорозетки виставлені за кресленням, вузол вводу й колектори змонтовані; труби не закриті до опресування"

  - key: pressure
    title: { ru: "Опрессовка водопровода", uk: "Опресування водопроводу" }
    lines: [work.pressure_test]
    photo: required  # манометр под давлением
    after: [water]
    result:
      - ru: "водопровод выдержал испытание давлением: давление по манометру не упало, течей нет"
        uk: "водопровід витримав випробування тиском: тиск за манометром не впав, протікань немає"
